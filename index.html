<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HnyGym-Pro | پلتفرم تخصصی بدنسازی</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/vazirmatn@5.0.19/index.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Vazirmatn', 'sans-serif'] },
                    colors: {
                        primary: '#f97316',
                        'primary-hover': '#ea580c',
                        dark: '#0f172a',
                        darker: '#020617',
                        card: '#1e293b',
                        'card-hover': '#334155',
                        border: '#334155',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #020617; color: #f8fafc; overflow: hidden; touch-action: manipulation; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .modal-overlay { background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); }
        .chat-bubble-me { background: #f97316; color: white; border-bottom-left-radius: 0; }
        .chat-bubble-them { background: #334155; color: white; border-bottom-right-radius: 0; }
        .nav-item.active { background: rgba(249, 115, 22, 0.15); color: #f97316; }
        .nav-item-mobile.active-mobile { color: #f97316; }
        .exercise-card:hover { transform: translateY(-2px); }
        .timer-circle { animation: pulse 1s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        @media (max-width: 768px) {
            .desktop-sidebar { display: none; }
            .mobile-bottom-nav { display: flex; }
            .main-content { padding-bottom: 80px; }
        }
        @media (min-width: 769px) {
            .mobile-bottom-nav { display: none; }
        }
        input, select, textarea { font-size: 16px !important; }
        .btn-primary { background: #f97316; color: white; transition: all 0.2s; }
        .btn-primary:hover { background: #ea580c; }
        .btn-primary:active { transform: scale(0.98); }
        .confetti { position: absolute; width: 10px; height: 10px; background: #f97316; animation: fall 3s linear infinite; }
        @keyframes fall { to { transform: translateY(100vh) rotate(720deg); } }
    </style>
</head>
<body class="antialiased h-screen">

    <!-- Auth Screen -->
    <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-darker p-4 overflow-y-auto">
        <div class="w-full max-w-lg my-4">
            <div class="text-center mb-8 fade-in">
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-br from-primary to-orange-600 mb-4 shadow-lg shadow-primary/20">
                    <i data-lucide="dumbbell" class="w-10 h-10 text-white"></i>
                </div>
                <h1 class="text-3xl font-bold text-white mb-2">HnyGym Pro</h1>
                <p class="text-gray-400 text-sm">پلتفرم تخصصی مدیریت باشگاه و بدنسازی</p>
            </div>
            
            <div class="bg-card border border-border rounded-2xl p-6 md:p-8 shadow-2xl fade-in">
                <div class="flex bg-darker rounded-xl p-1 mb-6">
                    <button type="button" data-auth="login" class="auth-tab flex-1 py-3 text-sm font-bold rounded-lg transition-all bg-primary text-white shadow-md">ورود</button>
                    <button type="button" data-auth="register" class="auth-tab flex-1 py-3 text-sm font-bold rounded-lg transition-all text-gray-400 hover:text-white">ثبت‌نام</button>
                </div>

                <form id="login-form" class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">نام کاربری</label>
                        <div class="relative">
                            <i data-lucide="user" class="w-5 h-5 text-gray-500 absolute right-3 top-1/2 -translate-y-1/2"></i>
                            <input type="text" id="login-username" value="admin" class="w-full bg-darker border border-border rounded-xl pr-10 pl-4 py-3 text-sm text-white outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">رمز عبور</label>
                        <div class="relative">
                            <i data-lucide="lock" class="w-5 h-5 text-gray-500 absolute right-3 top-1/2 -translate-y-1/2"></i>
                            <input type="password" id="login-password" value="123" class="w-full bg-darker border border-border rounded-xl pr-10 pl-4 py-3 text-sm text-white outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all">
                        </div>
                    </div>
                    <button type="submit" class="w-full btn-primary font-bold py-3.5 rounded-xl text-base shadow-lg shadow-primary/20 active:scale-[0.98] transition-transform">
                        ورود به پنل کاربری
                    </button>
                    <div class="text-center text-xs text-gray-500 pt-2 bg-darker/50 rounded-lg p-3 border border-border">
                        <p class="font-medium text-gray-400 
                    </div>
                </form>

                <form id="register-form" class="space-y-5 hidden">
                    <div class="bg-darker rounded-xl p-1 flex mb-2">
                        <button type="button" data-reg-role="student" class="reg-role-tab flex-1 py-2.5 text-sm font-bold rounded-lg transition-all bg-primary text-white">ثبت‌نام شاگرد</button>
                        <button type="button" data-reg-role="coach" class="reg-role-tab flex-1 py-2.5 text-sm font-bold rounded-lg transition-all text-gray-400 hover:text-white">ثبت‌نام مربی</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-300 mb-2">نام و نام خانوادگی</label>
                            <div class="relative">
                                <i data-lucide="user" class="w-5 h-5 text-gray-500 absolute right-3 top-1/2 -translate-y-1/2"></i>
                                <input type="text" id="reg-name" required class="w-full bg-darker border border-border rounded-xl pr-10 pl-4 py-3 text-sm text-white outline-none focus:border-primary transition-all">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">نام کاربری</label>
                            <div class="relative">
                                <i data-lucide="at-sign" class="w-5 h-5 text-gray-500 absolute right-3 top-1/2 -translate-y-1/2"></i>
                                <input type="text" id="reg-username" required class="w-full bg-darker border border-border rounded-xl pr-10 pl-4 py-3 text-sm text-white outline-none focus:border-primary transition-all">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">شماره تماس</label>

                                <i data-lucide="phone" class="w-5 h-5 text-gray-500 absolute right-3 top-1/2 -translate-y-1/2"></i>

                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">رمز عبور</label>

                                <i data-lucide="lock" class="w-5 h-5 text-gray-500 absolute right-3 top-1/2 -translate-y-1/2"></i>
                                <input type="password" id="reg-password" required class="w-full bg-darker border border-border rounded-xl pr-10 pl-4 py-3 text-sm text-white outline-none focus:border-primary transition-all">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">تکرار رمز عبور</label>
                            <div class="relative">
                                <i data-lucide="lock" class="w-5 h-5 text-gray-500 absolute right-3 top-1/2 -translate-y-1/2"></i>
                                <input type="password" id="reg-password-confirm" required class="w-full bg-darker border border-border rounded-xl pr-10 pl-4 py-3 text-sm text-white outline-none focus:border-primary transition-all">
                            </div>
                        </div>
                    </div>
                    <div id="coach-fields" class="hidden space-y-4 border-t border-border pt-4">

                            </div>
                        </div>
                    </div>
                    <div id="student-fields" class="space-y-4 border-t border-border pt-4">

                        <div class="grid grid-cols-3 gap-3">
                            <div>
                                <label class="block text-sm font-medium text-gray-300 mb-2">سن</label>
                                <input type="number" id="reg-age" min="10" max="90" class="w-full bg-darker border border-border rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-primary transition-all">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-300 mb-2">وزن (kg)</label>
                                <input type="number" id="reg-weight" min="30" max="200" class="w-full bg-darker border border-border rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-primary transition-all">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-300 mb-2">قد (cm)</label>
                                <input type="number" id="reg-height" min="100" max="250" class="w-full bg-darker border border-border rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-primary transition-all">
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-300 mb-2">هدف تمرینی</label>
                                <select id="reg-goal" class="w-full bg-darker border border-border rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-primary transition-all">

                                    <option value="کاهش وزن">کاهش وزن و چربی‌سوزی</option>

                            </div>

                                    <option value="4">۴ روز</option>
                                    <option value="5">۵ روز</option>

                <div class="flex items-center space-x-4 space-x-reverse">

            </header>
            <main id="main-content" class="main-content flex-1 p-4 md:p-8 overflow-y-auto"></main>
        </div>

            <div id="mobile-nav-items" class="flex justify-between items-center w-full"></div>
        </nav>
    </div>

    <div id="modal-container" class="fixed inset-0 z-50 hidden modal-overlay flex items-end md:items-center justify-center">
        <div class="bg-card border border-border rounded-t-2xl md:rounded-2xl shadow-2xl w-full max-w-lg fade-in max-h-[90vh] flex flex-col">
            <div class="p-4 md:p-6 border-b border-border flex justify-between items-center flex-shrink-0">
                <h3 id="modal-title" class="text-lg font-bold text-white">عنوان</h3>

                </button>
            </div>
            <div id="modal-body" class="p-4 md:p-6 overflow-y-auto flex-1"></div>
        </div>
    </div>

    <!-- Toast Container -->

                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div><h2 class="text-2xl font-bold text-white">حرکات ورزشی</h2><p class="text-sm text-gray-400 mt-1">کتابخانه جامع حرکات بدنسازی</p></div>
                        ${canEdit ? `<button id="add-exercise-btn" class="btn-primary px-4 py-2 rounded-lg text-sm font-medium flex items-center"><i data-lucide="plus" class="w-4 h-4 ml-1"></i>افزودن حرکت</button>` : ''}
                    </div>
                    <div class="flex flex-wrap gap-2 overflow-x-auto pb-2">
                        ${muscles.map(m => `<button data-action="filter-exercise" data-muscle="${m}" class="px-4 py-2 rounded-lg text-sm font-medium transition-colors flex-shrink-0 ${state.exerciseFilter === m ? 'bg-primary text-white' : 'bg-card text-gray-300 hover:bg-card-hover border border-border'}">${m}</button>`).join('')}
                        ${canEdit ? `<button id="add-category-btn" class="bg-card border border-border text-gray-300 hover:text-primary hover:border-primary px-3 py-2 rounded-lg text-sm font-medium transition-colors flex-shrink-0 flex items-center"><i data-lucide="plus" class="w-4 h-4 ml-1"></i>دسته جدید</button>` : ''}
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${filtered.map(ex => {
                            const color = muscleColors[ex.muscle] || 'from-gray-500 to-gray-700';
                            const diffColor = ex.difficulty === 'مبتدی' ? 'bg-green-500/20 text-green-400' : ex.difficulty === 'متوسط' ? 'bg-yellow-500/20 text-yellow-400' : 'bg-red-500/20 text-red-400';
                            return `
                                <div class="exercise-card bg-card border border-border rounded-xl overflow-hidden hover:border-primary/50 transition-all duration-300">
                                    <div class="h-40 bg-gradient-to-br ${color} relative overflow-hidden flex items-center justify-center">
                                        ${ex.image ? `<img src="${ex.image}" alt="${ex.name}" class="w-full h-full object-cover">` : `<i data-lucide="dumbbell" class="w-16 h-16 text-white/30"></i>`}
                                        <div class="absolute top-3 right-3"><span class="px-2 py-1 text-xs rounded-full ${diffColor} backdrop-blur-sm">${ex.difficulty}</span></div>
                                        ${ex.video ? '<div class="absolute top-3 left-3 bg-black/50 backdrop-blur-sm px-2 py-1 rounded-full text-xs text-white flex items-center"><i data-lucide="video" class="w-3 h-3 ml-1"></i>ویدیو</div>' : ''}
                                    </div>
                                    <div class="p-5">
                                        <h3 class="text-lg font-bold text-white mb-2">${ex.name}</h3>
                                        <p class="text-sm text-gray-400 mb-4 line-clamp-2">${ex.description}</p>
                                        <div class="flex items-center justify-between text-xs text-gray-500 pt-3 border-t border-border">
                                            <span class="flex items-center"><i data-lucide="target" class="w-3 h-3 ml-1"></i>${ex.muscle}</span>
                                            <span class="flex items-center"><i data-lucide="wrench" class="w-3 h-3 ml-1"></i>${ex.equipment}</span>
                                        </div>
                                        ${canEdit ? `
                                            <div class="flex gap-2 mt-4 pt-4 border-t border-border">
                                                <button data-action="edit-exercise" data-id="${ex.id}" class="flex-1 bg-card-hover hover:bg-gray-600 text-white py-2 rounded-lg text-sm font-medium transition-colors flex items-center justify-center"><i data-lucide="edit-2" class="w-4 h-4 ml-1"></i>ویرایش</button>
                                                <button data-action="delete-exercise" data-id="${ex.id}" class="px-3 py-2 bg-red-500/10 hover:bg-red-500/20 text-red-400 rounded-lg transition-colors"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                            </div>
                                        ` : ''}
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                    ${filtered.length === 0 ? '<div class="p-8 text-center text-gray-400 bg-card border border-border rounded-xl">هیچ حرکتی در این دسته‌بندی یافت نشد.</div>' : ''}
                </div>
            `;
        }

        function renderPlanWorkout() {
            const myStudents = state.users.filter(u => u.role === 'student' && u.coachId === state.currentUser.id);
            const selectedStudentId = state.selectedPlanStudent || (myStudents.length > 0 ? myStudents[0].id : null);
            const selectedStudent = state.users.find(u => u.id === selectedStudentId);
            const plan = selectedStudentId ? state.workoutPlans[selectedStudentId] : null;

            return `
                <div class="fade-in space-y-6">
                    <div><h2 class="text-2xl font-bold text-white">برنامه‌ریزی تمرین</h2><p class="text-sm text-gray-400 mt-1">تنظیم برنامه تمرینی برای شاگردان</p></div>
                    <div class="bg-card border border-border rounded-xl p-4 md:p-6">
                        <label class="block text-sm text-gray-400 mb-2">انتخاب شاگرد</label>
                        <select id="plan-student-select" class="w-full bg-darker border border-border rounded-lg px-4 py-3 text-sm text-white outline-none focus:border-primary">
                            ${myStudents.map(s => `<option value="${s.id}" ${s.id === selectedStudentId ? 'selected' : ''}>${s.name} (${s.daysPerWeek} روز در هفته)</option>`).join('')}
                        </select>
                    </div>
                    ${selectedStudent ? `
                        <div class="bg-card border border-border rounded-xl p-4 md:p-6">
                            <div class="flex items-center justify-between mb-4">
                                <h3 class="text-lg font-bold text-white">برنامه ${selectedStudent.name}</h3>
                                <span class="text-xs bg-primary/20 text-primary px-3 py-1 rounded-full">${selectedStudent.daysPerWeek} روز در هفته</span>
                            </div>
                            ${plan ? `
                                <div class="space-y-4">
                                    ${plan.days.map((day, dayIndex) => `
                                        <div class="bg-darker border border-border rounded-lg p-4">
                                            <div class="flex items-center justify-between mb-3">
                                                <h4 class="font-bold text-white">${day.name} - ${day.muscle}</h4>
                                                <button data-action="edit-day" data-student="${selectedStudentId}" data-day="${dayIndex}" class="text-xs text-primary hover:text-primary-hover flex items-center gap-1"><i data-lucide="edit-2" class="w-3 h-3"></i> ویرایش روز</button>
                                            </div>
                                            <div class="space-y-2">
                                                ${day.exercises.map((ex, exIndex) => {
                                                    const exercise = state.exercises.find(e => e.id === ex.exerciseId);
                                                    return `
                                                        <div class="flex items-center justify-between p-3 bg-card rounded-lg border border-border">
                                                            <div class="flex items-center min-w-0">
                                                                <div class="w-8 h-8 rounded-lg bg-primary/20 flex items-center justify-center text-primary ml-3 flex-shrink-0"><i data-lucide="dumbbell" class="w-4 h-4"></i></div>
                                                                <div class="min-w-0"><p class="text-sm font-medium text-white truncate">${exercise ? exercise.name : 'حرکت'}</p><p class="text-xs text-gray-400">${ex.sets} ست × ${ex.reps} تکرار | استراحت: ${ex.rest} ثانیه</p></div>
                                                            </div>
                                                            <button data-action="remove-exercise-from-plan" data-student="${selectedStudentId}" data-day="${dayIndex}" data-exercise="${exIndex}" class="p-1.5 text-gray-400 hover:text-red-400"><i data-lucide="x" class="w-4 h-4"></i></button>
                                                        </div>
                                                    `;
                                                }).join('')}
                                                <button data-action="add-exercise-to-day" data-student="${selectedStudentId}" data-day="${dayIndex}" class="w-full mt-2 border-2 border-dashed border-border hover:border-primary text-gray-400 hover:text-primary py-2 rounded-lg text-sm font-medium transition-colors flex items-center justify-center"><i data-lucide="plus" class="w-4 h-4 ml-1"></i>افزودن حرکت</button>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : `
                                <div class="text-center py-8">
                                    <i data-lucide="clipboard-list" class="w-12 h-12 text-gray-500 mx-auto mb-3"></i>
                                    <p class="text-gray-400 mb-4">هنوز برنامه‌ای برای این شاگرد تنظیم نشده است</p>
                                    <button data-action="create-plan" data-student="${selectedStudentId}" class="btn-primary px-6 py-3 rounded-lg font-medium">ایجاد برنامه تمرینی</button>
                                </div>
                            `}
                        </div>
                    ` : '<div class="bg-card border border-border rounded-xl p-8 text-center text-gray-400">شاگردی یافت نشد.</div>'}
                </div>
            `;
        }

        function renderActiveWorkout() {
            const session = state.workoutSession;
            const plan = state.workoutPlans[state.currentUser.id];
            const day = plan.days[session.dayIndex];
            const exercise = day.exercises[session.exerciseIndex];
            const exDetails = state.exercises.find(e => e.id === exercise.exerciseId);
            
            const totalExercises = day.exercises.length;
            const progressPercent = ((session.exerciseIndex) / totalExercises) * 100;
            
            const isLastSet = session.setIndex >= exercise.sets - 1;
            const isLastExercise = session.exerciseIndex >= totalExercises - 1;

            return `
                <div class="fade-in space-y-6 pb-20 max-w-2xl mx-auto">
                    <div class="bg-card border border-border rounded-xl p-4">
                        <div class="flex justify-between text-sm text-gray-400 mb-2">
                            <span>پیشرفت تمرین</span>
                            <span>${session.exerciseIndex + 1} از ${totalExercises} حرکت</span>
                        </div>
                        <div class="w-full bg-darker rounded-full h-2">
                            <div class="bg-primary h-2 rounded-full transition-all duration-500" style="width: ${progressPercent}%"></div>
                        </div>
                    </div>

                    <div class="bg-card border border-border rounded-2xl overflow-hidden shadow-xl">
                        ${exDetails && exDetails.image ? `<img src="${exDetails.image}" class="w-full h-48 object-cover" alt="${exDetails.name}">` : `
                            <div class="w-full h-48 bg-gradient-to-br from-primary/20 to-orange-600/20 flex items-center justify-center">
                                <i data-lucide="dumbbell" class="w-20 h-20 text-primary/50"></i>
                            </div>
                        `}
                        <div class="p-6">
                            <div class="flex items-center justify-between mb-4">
                                <h2 class="text-2xl font-bold text-white">${exDetails ? exDetails.name : 'حرکت'}</h2>
                                <span class="px-3 py-1 bg-primary/20 text-primary rounded-full text-sm font-bold">ست ${session.setIndex + 1} از ${exercise.sets}</span>
                            </div>
                            
                            <div class="grid grid-cols-3 gap-4 mb-6">
                                <div class="bg-darker rounded-xl p-4 text-center border border-border">
                                    <i data-lucide="layers" class="w-6 h-6 text-blue-400 mx-auto mb-2"></i>
                                    <p class="text-xs text-gray-400">تکرار</p>
                                    <p class="text-xl font-bold text-white">${exercise.reps}</p>
                                </div>
                                <div class="bg-darker rounded-xl p-4 text-center border border-border">
                                    <i data-lucide="clock" class="w-6 h-6 text-green-400 mx-auto mb-2"></i>
                                    <p class="text-xs text-gray-400">استراحت</p>
                                    <p class="text-xl font-bold text-white">${exercise.rest}s</p>
                                </div>
                                <div class="bg-darker rounded-xl p-4 text-center border border-border">
                                    <i data-lucide="target" class="w-6 h-6 text-purple-400 mx-auto mb-2"></i>
                                    <p class="text-xs text-gray-400">عضله</p>
                                    <p class="text-lg font-bold text-white">${exDetails ? exDetails.muscle : '-'}</p>
                                </div>
                            </div>

                            ${exDetails && exDetails.description ? `<p class="text-sm text-gray-400 mb-6 bg-darker/50 p-3 rounded-lg border border-border">${exDetails.description}</p>` : ''}

                            <div class="space-y-3">
                                <button data-action="complete-set" class="w-full btn-primary py-4 rounded-xl font-bold text-lg shadow-lg flex items-center justify-center gap-2">
                                    <i data-lucide="check-circle" class="w-6 h-6"></i>
                                    ثبت انجام ست
                                </button>
                                
                                ${isLastSet ? `
                                    <button data-action="next-exercise" class="w-full bg-card-hover hover:bg-gray-600 text-white py-4 rounded-xl font-bold text-lg transition-colors flex items-center justify-center gap-2 border border-border">
                                        ${isLastExercise ? 'پایان تمرین و ثبت نتیجه' : 'حرکت بعدی'}
                                        <i data-lucide="arrow-left" class="w-6 h-6"></i>
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    </div>

                    <div id="rest-timer-container" class="hidden bg-darker border-2 border-primary rounded-2xl p-6 text-center shadow-2xl">
                        <p class="text-sm text-gray-400 mb-2">زمان استراحت تا ست بعدی</p>
                        <div id="rest-timer-display" class="text-6xl font-bold text-primary mb-6 timer-circle font-mono">0</div>
                        <div class="flex gap-3">
                            <button onclick="window.stopRestTimer(); document.getElementById('rest-timer-container').classList.add('hidden');" class="flex-1 bg-card-hover hover:bg-gray-600 text-white py-3 rounded-xl font-medium transition-colors">رد کردن استراحت</button>
                            <button onclick="window.stopRestTimer(); document.getElementById('rest-timer-container').classList.add('hidden');" class="flex-1 btn-primary py-3 rounded-xl font-medium">شروع ست بعدی</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderWorkoutComplete() {
            const session = state.workoutSession;
            const durationMins = Math.round((Date.now() - session.startTime) / 60000);
            
            return `
                <div class="fade-in flex flex-col items-center justify-center min-h-[60vh] text-center px-4 relative overflow-hidden">
                    <div class="confetti" style="left: 10%; animation-delay: 0s; background: #f97316;"></div>
                    <div class="confetti" style="left: 30%; animation-delay: 1s; background: #22c55e;"></div>
                    <div class="confetti" style="left: 50%; animation-delay: 0.5s; background: #3b82f6;"></div>
                    <div class="confetti" style="left: 70%; animation-delay: 1.5s; background: #eab308;"></div>
                    <div class="confetti" style="left: 90%; animation-delay: 0.2s; background: #ec4899;"></div>

                    <div class="w-24 h-24 rounded-full bg-green-500/20 flex items-center justify-center mb-6 animate-bounce">
                        <i data-lucide="trophy" class="w-12 h-12 text-green-400"></i>
                    </div>
                    <h2 class="text-3xl md:text-4xl font-bold text-white mb-4">تبریک! 🎉</h2>
                    <p class="text-gray-400 mb-8 max-w-md">تمرین امروز شما با موفقیت به پایان رسید. به تلاش خود افتخار کن!</p>
                    
                    <div class="grid grid-cols-2 gap-4 w-full max-w-md mb-8">
                        <div class="bg-card border border-border rounded-xl p-4">
                            <p class="text-xs text-gray-400 mb-1">مدت زمان</p>
                            <p class="text-2xl font-bold text-white">${durationMins} دقیقه</p>
                        </div>
                        <div class="bg-card border border-border rounded-xl p-4">
                            <p class="text-xs text-gray-400 mb-1">ست‌های انجام شده</p>
                            <p class="text-2xl font-bold text-white">${session.completedSets}</p>
                        </div>
                    </div>

                    <button data-nav="dashboard" class="btn-primary px-8 py-4 rounded-xl font-bold text-lg shadow-lg flex items-center gap-2">
                        <i data-lucide="home" class="w-5 h-5"></i>
                        بازگشت به داشبورد
                    </button>
                </div>
            `;
        }

        function renderMyWorkouts() {
            const student = state.currentUser;
            const plan = state.workoutPlans[student.id];
            
            if (state.workoutSession.active) {
                return renderActiveWorkout();
            }
            
            if (state.workoutSession.completed) {
                return renderWorkoutComplete();
            }

            if (!plan) {
                return `<div class="fade-in flex items-center justify-center h-full"><div class="text-center"><i data-lucide="clipboard-list" class="w-16 h-16 text-gray-500 mx-auto mb-4"></i><h3 class="text-xl font-bold text-white mb-2">برنامه‌ای موجود نیست</h3><p class="text-gray-400">مربی شما هنوز برنامه تمرینی تنظیم نکرده است.</p></div></div>`;
            }

            const todayIndex = state.currentWorkoutDay || 0;
            const todayPlan = plan.days[todayIndex];

            return `
                <div class="fade-in space-y-6 pb-20 max-w-2xl mx-auto">
                    <div class="bg-gradient-to-l from-primary to-orange-600 rounded-2xl p-6 text-white relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-64 h-64 bg-white/10 rounded-full -translate-y-1/2 translate-x-1/2"></div>
                        <div class="relative z-10">
                            <div class="flex items-center justify-between mb-2">
                                <h2 class="text-2xl font-bold">${todayPlan.name}</h2>
                                <span class="text-xs bg-white/20 backdrop-blur-sm px-3 py-1 rounded-full">${todayPlan.muscle}</span>
                            </div>
                            <p class="text-orange-100 text-sm">روز ${todayIndex + 1} از ${plan.days.length} روز</p>
                        </div>
                    </div>

                    <div class="flex gap-2 overflow-x-auto pb-2">
                        ${plan.days.map((day, idx) => `<button data-action="select-workout-day" data-day="${idx}" class="flex-shrink-0 px-4 py-2 rounded-lg text-sm font-medium transition-colors ${idx === todayIndex ? 'bg-primary text-white' : 'bg-card text-gray-300 border border-border'}">${day.name}</button>`).join('')}
                    </div>

                    <div class="bg-card border border-border rounded-xl p-6 text-center">
                        <i data-lucide="play-circle" class="w-16 h-16 text-primary mx-auto mb-4"></i>
                        <h3 class="text-xl font-bold text-white mb-2">آماده شروع هستید؟</h3>
                        <p class="text-gray-400 mb-6 text-sm">این برنامه شامل ${todayPlan.exercises.length} حرکت است. روی دکمه زیر بزنید تا راهنمای ست به ست شروع شود.</p>
                        <button data-action="start-workout" class="w-full btn-primary py-4 rounded-xl font-bold text-lg shadow-lg flex items-center justify-center gap-2">
                            <i data-lucide="dumbbell" class="w-6 h-6"></i>
                            شروع تمرین
                        </button>
                    </div>
                </div>
            `;
        }

        function renderMessages() {
            const availableChats = getAvailableChats();
            const currentChat = state.chats.find(c => c.id === state.activeChat);
            const isAdmin = state.currentUser.role === 'admin';

            return `
                <div class="fade-in h-[calc(100vh-140px)] md:h-[calc(100vh-160px)] bg-card border border-border rounded-xl overflow-hidden flex flex-col md:flex-row">
                    <div class="w-full md:w-80 border-l border-border flex flex-col bg-darker/50 flex-shrink-0 ${state.activeChat && window.innerWidth < 768 ? 'hidden' : 'flex'}">
                        <div class="p-4 border-b border-border flex-shrink-0">
                            <h3 class="text-lg font-bold text-white mb-3">${isAdmin ? 'نظارت بر پیام‌ها' : 'پیام‌رسان'}</h3>
                            <div class="relative"><i data-lucide="search" class="w-4 h-4 text-gray-400 absolute right-3 top-1/2 -translate-y-1/2"></i><input type="text" placeholder="جستجوی مخاطب..." class="bg-card border border-border rounded-lg pr-10 pl-4 py-2 text-sm text-white outline-none focus:border-primary w-full"></div>
                        </div>
                        <div class="flex-1 overflow-y-auto">
                            ${availableChats.length === 0 ? '<div class="p-4 text-center text-gray-400 text-sm">گفتگویی یافت نشد.</div>' : ''}
                            ${availableChats.map(chat => {
                                const lastMsg = chat.messages[chat.messages.length - 1];
                                const isActive = state.activeChat === chat.id;
                                const displayName = isAdmin ? `${chat.studentName} ⇄ ${chat.coachName}` : (chat.studentName || chat.coachName);
                                return `<button data-action="select-chat" data-chat-id="${chat.id}" class="w-full p-4 flex items-center hover:bg-card transition-colors ${isActive ? 'bg-card border-r-2 border-primary' : ''}">
                                    <div class="w-10 h-10 rounded-full bg-primary/20 flex items-center justify-center text-primary font-bold ml-3 flex-shrink-0">${displayName.charAt(0)}</div>
                                    <div class="flex-1 text-right overflow-hidden min-w-0"><div class="flex justify-between items-center mb-1"><span class="text-sm font-medium text-white truncate">${displayName}</span><span class="text-xs text-gray-500 flex-shrink-0 mr-2">${lastMsg ? lastMsg.time : ''}</span></div><p class="text-xs text-gray-400 truncate">${lastMsg ? (lastMsg.type === 'text' ? lastMsg.content : (lastMsg.type === 'image' ? '📷 تصویر ارسال شد' : '🎥 ویدیو ارسال شد')) : 'شروع گفتگو'}</p></div>
                                </button>`;
                            }).join('')}
                        </div>
                    </div>
                    
                    <div class="flex-1 flex flex-col min-w-0 ${state.activeChat ? 'flex' : 'hidden md:flex'}">
                        ${currentChat ? `
                            <div class="p-4 border-b border-border flex items-center justify-between bg-darker/30 flex-shrink-0">
                                <div class="flex items-center min-w-0">
                                    <button data-action="back-to-chats" class="md:hidden p-2 text-gray-400 hover:text-white ml-2"><i data-lucide="arrow-right" class="w-5 h-5"></i></button>
                                    <div class="w-10 h-10 rounded-full bg-primary/20 flex items-center justify-center text-primary font-bold ml-3 flex-shrink-0">${(isAdmin ? currentChat.studentName : (currentChat.studentName || currentChat.coachName)).charAt(0)}</div>
                                    <div class="min-w-0">
                                        <h4 class="text-sm font-bold text-white truncate">${isAdmin ? currentChat.studentName + ' و ' + currentChat.coachName : (currentChat.studentName || currentChat.coachName)}</h4>
                                        <p class="text-xs text-green-400">${isAdmin ? 'حالت نظارت مدیریت (فقط خواندنی)' : 'آنلاین'}</p>
                                    </div>
                                </div>
                            </div>
                            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4 bg-darker/20">
                                ${currentChat.messages.map(msg => {
                                    const isMe = msg.senderId === state.currentUser.id;
                                    if (msg.type === 'image') {
                                        return `<div class="flex ${isMe ? 'justify-start' : 'justify-end'}"><div class="${isMe ? 'chat-bubble-me' : 'chat-bubble-them'} p-2 rounded-2xl max-w-[80%] shadow-sm"><img src="${msg.content}" class="rounded-lg max-w-full h-auto max-h-60 mb-1" alt="image"><p class="text-[10px] opacity-70 text-left">${msg.time}</p></div></div>`;
                                    } else if (msg.type === 'video') {
                                        return `<div class="flex ${isMe ? 'justify-start' : 'justify-end'}"><div class="${isMe ? 'chat-bubble-me' : 'chat-bubble-them'} p-2 rounded-2xl max-w-[80%] shadow-sm"><video src="${msg.content}" controls class="rounded-lg max-w-full h-auto max-h-60 mb-1"></video><p class="text-[10px] opacity-70 text-left">${msg.time}</p></div></div>`;
                                    } else {

                                }).join('')}

                                    <form id="chat-form" class="flex items-center gap-3">
                                        <input type="file" id="chat-file-input" accept="image/*,video/*" class="hidden" onchange="window.handleChatFile(this)">
                                        <button type="button" onclick="document.getElementById('chat-file-input').click()" class="p-3 text-gray-400 hover:text-primary transition-colors flex-shrink-0" title="ارسال عکس یا ویدیو">
                                            <i data-lucide="paperclip" class="w-5 h-5"></i>
                                        </button>
                                        <input type="text" id="chat-input" placeholder="پیام خود را بنویسید..." class="flex-1 bg-card border border-border rounded-lg px-4 py-3 text-sm text-white outline-none focus:border-primary min-w-0">
                                        <button type="submit" class="btn-primary p-3 rounded-lg flex-shrink-0"><i data-lucide="send" class="w-5 h-5"></i></button>
                                    </form>
                                </div>
                            ` : `
                                <div class="p-4 border-t border-border bg-darker/30 flex-shrink-0 text-center">
                                    <p class="text-xs text-gray-500 flex items-center justify-center"><i data-lucide="eye" class="w-4 h-4 ml-1"></i> شما به عنوان مدیر فقط امکان مشاهده این گفتگو را دارید.</p>
                                </div>
                            `}
                        ` : `
                            <div class="flex-1 flex items-center justify-center bg-darker/20">
                                <div class="text-center text-gray-500">
                                    <i data-lucide="message-circle" class="w-16 h-16 mx-auto mb-4 opacity-50"></i>
                                    <p>یک گفتگو را برای شروع انتخاب کنید</p>
                                </div>
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        function renderProfile() {
            const user = state.currentUser;
            return `
                <div class="fade-in space-y-6 max-w-3xl">
                    <div><h2 class="text-2xl font-bold text-white">پروفایل کاربری</h2><p class="text-sm text-gray-400 mt-1">مشاهده و ویرایش اطلاعات شخصی</p></div>
                    <div class="bg-card border border-border rounded-xl p-6">
                        <div class="flex flex-col md:flex-row items-center mb-6">
                            <div class="relative mb-4 md:mb-0 md:ml-6">
                                ${user.avatar ? `<img src="${user.avatar}" class="w-24 h-24 rounded-full object-cover border-4 border-primary">` : `<div class="w-24 h-24 rounded-full bg-gradient-to-br from-primary to-orange-600 flex items-center justify-center text-white font-bold text-4xl border-4 border-primary">${user.name.charAt(0)}</div>`}
                                <label class="absolute bottom-0 right-0 bg-card border border-border rounded-full p-2 cursor-pointer hover:bg-card-hover transition-colors">
                                    <i data-lucide="camera" class="w-4 h-4 text-white"></i>
                                    <input type="file" accept="image/*" class="hidden" onchange="window.updateAvatar(this)">
                                </label>
                            </div>
                            <div class="text-center md:text-right">
                                <h3 class="text-xl font-bold text-white">${user.name}</h3>
                                <p class="text-sm text-gray-400">${roleLabels[user.role]}</p>
                            </div>
                        </div>
                        <form id="profile-form" class="space-y-4">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div><label class="block text-sm text-gray-400 mb-2">نام و نام خانوادگی</label><input type="text" name="name" value="${user.name}" class="w-full bg-darker border border-border rounded-lg px-4 py-3 text-sm text-white outline-none focus:border-primary"></div>
                                <div><label class="block text-sm text-gray-400 mb-2">شماره تماس</label><input type="text" name="phone" value="${user.phone || ''}" class="w-full bg-darker border border-border rounded-lg px-4 py-3 text-sm text-white outline-none focus:border-primary"></div>
                                ${user.role === 'student' ? `
                                    <div><label class="block text-sm text-gray-400 mb-2">وزن (kg)</label><input type="number" name="weight" value="${user.weight || ''}" class="w-full bg-darker border border-border rounded-lg px-4 py-3 text-sm text-white outline-none focus:border-primary"></div>
                                    <div><label class="block text-sm text-gray-400 mb-2">هدف تمرینی</label><input type="text" name="goal" value="${user.goal || ''}" class="w-full bg-darker border border-border rounded-lg px-4 py-3 text-sm text-white outline-none focus:border-primary"></div>
                                ` : ''}
                            </div>
                            <button type="submit" class="btn-primary px-6 py-3 rounded-lg text-sm font-medium">ذخیره تغییرات</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderSettings() {
            return `
                <div class="fade-in space-y-6 max-w-3xl">
                    <div><h2 class="text-2xl font-bold text-white">تنظیمات سیستم</h2><p class="text-sm text-gray-400 mt-1">مدیریت پروفایل و تنظیمات پنل</p></div>
                    <div class="bg-card border border-border rounded-xl p-6">
                        <h3 class="text-lg font-bold text-white mb-4 flex items-center"><i data-lucide="building-2" class="w-5 h-5 ml-2 text-primary"></i>اطلاعات باشگاه</h3>
                        <form id="gym-settings-form" class="space-y-4">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div><label class="block text-sm text-gray-400 mb-2">نام باشگاه</label><input type="text" value="HnyGym Pro" class="w-full bg-darker border border-border rounded-lg px-4 py-3 text-sm text-white outline-none focus:border-primary"></div>
                                <div><label class="block text-sm text-gray-400 mb-2">تلفن تماس</label><input type="text" value="021-12345678" class="w-full bg-darker border border-border rounded-lg px-4 py-3 text-sm text-white outline-none focus:border-primary"></div>
                            </div>
                            <button type="submit" class="btn-primary px-6 py-3 rounded-lg text-sm font-medium">ذخیره تغییرات</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function render() {
            if (!state.isLoggedIn) {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app-layout').classList.add('hidden');
                return;
            }
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-layout').classList.remove('hidden');
            
            const sidebar = document.getElementById('sidebar');
            const mainWrapper = document.getElementById('main-wrapper');
            const backdrop = document.getElementById('sidebar-backdrop');
            const isMobile = window.innerWidth < 768;
            
            if (state.isSidebarOpen) {
                sidebar.classList.remove('translate-x-full');
                if (!isMobile) {
                    sidebar.classList.remove('md:translate-x-full');
                    mainWrapper.classList.add('md:mr-64');
                } else {
                    backdrop.classList.remove('hidden');
                }
            } else {
                sidebar.classList.add('translate-x-full');
                if (!isMobile) {
                    sidebar.classList.add('md:translate-x-full');
                    mainWrapper.classList.remove('md:mr-64');
                }
                backdrop.classList.add('hidden');
            }

            renderSidebar();
            renderMobileNav();
            
            const mainContent = document.getElementById('main-content');
            const pageTitle = document.getElementById('page-title');
            
            switch(state.currentView) {
                case 'dashboard': mainContent.innerHTML = renderDashboard(); pageTitle.textContent = 'داشبورد'; break;
                case 'students': case 'my-students': mainContent.innerHTML = renderStudents(); pageTitle.textContent = 'شاگردان'; break;
                case 'coaches': mainContent.innerHTML = renderCoaches(); pageTitle.textContent = 'مربیان'; break;
                case 'exercises': mainContent.innerHTML = renderExercises(); pageTitle.textContent = 'حرکات ورزشی'; break;
                case 'messages': mainContent.innerHTML = renderMessages(); pageTitle.textContent = 'پیام‌رسان'; break;
                case 'settings': mainContent.innerHTML = renderSettings(); pageTitle.textContent = 'تنظیمات'; break;
                case 'profile': mainContent.innerHTML = renderProfile(); pageTitle.textContent = 'پروفایل'; break;
                case 'plan-workout': mainContent.innerHTML = renderPlanWorkout(); pageTitle.textContent = 'برنامه‌ریزی'; break;
                case 'my-workouts': 
                    if (state.workoutSession.completed) {
                        mainContent.innerHTML = renderWorkoutComplete(); 
                        pageTitle.textContent = 'پایان تمرین';
                    } else if (state.workoutSession.active) {
                        mainContent.innerHTML = renderActiveWorkout(); 
                        pageTitle.textContent = 'در حال تمرین';
                    } else {
                        mainContent.innerHTML = renderMyWorkouts(); 
                        pageTitle.textContent = 'تمرین من';
                    }
                    break;
                default: mainContent.innerHTML = renderDashboard(); pageTitle.textContent = 'داشبورد';
            }
            lucide.createIcons();
            mainContent.scrollTop = 0;
        }

        // --- Event Listeners ---
        document.querySelectorAll('.auth-tab').forEach(tab => {
            tab.addEventListener('click', (e) => {
                e.preventDefault();
                document.querySelectorAll('.auth-tab').forEach(t => {
                    t.classList.remove('bg-primary', 'text-white', 'shadow-md');
                    t.classList.add('text-gray-400');
                });
                e.target.classList.add('bg-primary', 'text-white', 'shadow-md');
                e.target.classList.remove('text-gray-400');
                const isLogin = e.target.dataset.auth === 'login';
                document.getElementById('login-form').classList.toggle('hidden', !isLogin);
                document.getElementById('register-form').classList.toggle('hidden', isLogin);
            });
        });

        document.querySelectorAll('.reg-role-tab').forEach(tab => {
            tab.addEventListener('click', (e) => {
                e.preventDefault();
                document.querySelectorAll('.reg-role-tab').forEach(t => {
                    t.classList.remove('bg-primary', 'text-white');
                    t.classList.add('text-gray-400');
                });
                e.target.classList.add('bg-primary', 'text-white');
                e.target.classList.remove('text-gray-400');
                state.registerRole = e.target.dataset.regRole;
                document.getElementById('coach-fields').classList.toggle('hidden', state.registerRole !== 'coach');
                document.getElementById('student-fields').classList.toggle('hidden', state.registerRole !== 'student');
            });
        });

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value.trim();
            if (!username || !password) {
                window.showToast('لطفاً نام کاربری و رمز عبور را وارد کنید', 'error');
                return;
            }
            const user = state.users.find(u => u.username === username && u.password === password);
            if (user) {
                state.currentUser = user;
                state.isLoggedIn = true;
                state.currentView = 'dashboard';
                state.activeChat = null;
                state.workoutSession = { active: false, dayIndex: 0, exerciseIndex: 0, setIndex: 0, startTime: null, completedSets: 0, completed: false };
                render();
                window.showToast(`خوش آمدید ${user.name}`, 'success');
            } else {
                window.showToast('نام کاربری یا رمز عبور اشتباه است', 'error');
            }
        });

        document.getElementById('register-form').addEventListener('submit', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const name = document.getElementById('reg-name').value.trim();
            const username = document.getElementById('reg-username').value.trim();
            const password = document.getElementById('reg-password').value;
            const passwordConfirm = document.getElementById('reg-password-confirm').value;
            const phone = document.getElementById('reg-phone').value.trim();

            if (!name || !username || !password || !phone) {
                window.showToast('لطفاً تمام فیلدهای ضروری را پر کنید', 'error');
                return;
            }
            if (password !== passwordConfirm) {
                window.showToast('رمز عبور و تکرار آن مطابقت ندارند', 'error');
                return;
            }
            if (state.users.find(u => u.username === username)) {
                window.showToast('این نام کاربری قبلاً ثبت شده است', 'error');
                return;
            }

            const newUser = {
                id: Math.max(...state.users.map(u => u.id), 0) + 1,
                username, password, name, phone, role: state.registerRole, avatar: null, streak: 0, lastWorkoutDate: null
            };

            if (state.registerRole === 'coach') {
                newUser.specialty = document.getElementById('reg-specialty').value;
                newUser.experience = document.getElementById('reg-experience').value || 0;
                newUser.certification = document.getElementById('reg-certification').value || '';
            } else {
                newUser.age = parseInt(document.getElementById('reg-age').value) || 0;
                newUser.weight = parseInt(document.getElementById('reg-weight').value) || 70;
                newUser.height = parseInt(document.getElementById('reg-height').value) || 170;
                newUser.goal = document.getElementById('reg-goal').value;
                newUser.daysPerWeek = parseInt(document.getElementById('reg-days').value) || 3;
                newUser.medical = document.getElementById('reg-medical').value || '';
                newUser.plan = 'عادی';
                const coaches = state.users.filter(u => u.role === 'coach');
                if (coaches.length > 0) {
                    newUser.coachId = coaches[0].id;
                    state.chats.push({
                        id: `chat_${newUser.id}_${newUser.coachId}`,
                        studentId: newUser.id, studentName: newUser.name,
                        coachId: newUser.coachId, coachName: coaches[0].name,
                        messages: []
                    });
                }
            }

            state.users.push(newUser);
            window.showToast('ثبت‌نام با موفقیت انجام شد! اکنون وارد شوید', 'success');
            document.getElementById('register-form').reset();
            document.querySelector('[data-auth="login"]').click();
            document.getElementById('login-username').value = username;
            document.getElementById('login-password').value = password;
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            state.isLoggedIn = false;
            state.currentUser = null;
            state.currentView = 'dashboard';
            state.activeChat = null;
            state.workoutSession = { active: false, dayIndex: 0, exerciseIndex: 0, setIndex: 0, startTime: null, completedSets: 0, completed: false };
            render();
            window.showToast('با موفقیت خارج شدید', 'info');
        });

        document.body.addEventListener('click', (e) => {
            const target = e.target.closest('[data-nav]') || e.target.closest('[data-action]');
            if (!target) return;

            if (target.dataset.nav) {
                state.currentView = target.dataset.nav;
                if (target.dataset.nav === 'my-workouts') {
                    state.currentWorkoutDay = 0;
                    state.workoutSession = { active: false, dayIndex: 0, exerciseIndex: 0, setIndex: 0, startTime: null, completedSets: 0, completed: false };
                }
                if (target.dataset.nav === 'messages') state.activeChat = null;
                render();
                return;
            }

            const action = target.dataset.action;

            if (action === 'delete-student') {
                const id = parseInt(target.dataset.id);
                if(confirm('آیا از حذف این شاگرد اطمینان دارید؟')) {
                    state.users = state.users.filter(u => u.id !== id);
                    state.chats = state.chats.filter(c => c.studentId !== id);
                    render();
                    window.showToast('شاگرد با موفقیت حذف شد', 'success');
                }
            }
            if (action === 'edit-student') {
                const id = parseInt(target.dataset.id);
                const student = state.users.find(u => u.id === id);
                if (!student) return;
                const coaches = state.users.filter(u => u.role === 'coach');
                window.openModal('ویرایش شاگرد', `
                    <form id="edit-student-form" class="space-y-4">
                        <input type="hidden" name="id" value="${student.id}">
                        <div><label class="block text-sm text-gray-400 mb-2">نام و نام خانوادگی</label><input type="text" name="name" value="${student.name}" required class="w-full bg-darker border border-border rounded-lg px-4 py-3 text-sm text-white outline-none focus:border-primary"></div>
                        <div><label class="block text-sm text-gray-400 mb-2">شماره تماس</label><input type="text" name="phone" value="${student.phone || ''}" class="w-full bg-darker border border-border rounded-lg px-4 py-3 text-sm text-white outline-none focus:border-primary"></div>
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="block text-sm text-gray-400 mb-2">پلن</label><select name="plan" class="w-full bg-darker border border-border rounded-lg px-4 py-3 text-sm text-white outline-none focus:border-primary"><option ${student.plan === 'طلایی' ? 'selected' : ''}>طلایی</option><option ${student.plan === 'نقره‌ای' ? 'selected' : ''}>نقره‌ای</option><option ${student.plan === 'برنزی' ? 'selected' : ''}>برنزی</option><option ${!student.plan || student.plan === 'عادی' ? 'selected' : ''}>عادی</option></select></div>
                            <div><label class="block text-sm text-gray-400 mb-2">روز در هفته</label><input type="number" name="daysPerWeek" value="${student.daysPerWeek || 3}" min="1" max="7" class="w-full bg-darker border border-border rounded-lg px-4 py-3 text-sm text-white outline-none focus:border-primary"></div>
                        </div>
                        <div><label class="block text-sm text-gray-400 mb-2">مربی</label><select name="coachId" class="w-full bg-darker border border-border rounded-lg px-4 py-3 text-sm text-white outline-none focus:border-primary"><option value="">بدون مربی</option>${coaches.map(c => `<option value="${c.id}" ${student.coachId === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}</select></div>
                        <div class="flex justify-end gap-3 pt-4">
                            <button type="button" onclick="window.closeModal()" class="px-4 py-2 text-gray-300 hover:text-white text-sm bg-card-hover rounded-lg">انصراف</button>
                            <button type="submit" class="btn-primary px-6 py-2 rounded-lg text-sm font-medium">ذخیره</button>
                        </div>
                    </form>
                `);
            }
            if (action === 'delete-coach') {
                const id = parseInt(target.dataset.id);
                if(confirm('آیا از حذف این مربی اطمینان دارید؟')) {
                    state.users = state.users.filter(u => u.id !== id);
                    render();
                    window.showToast('مربی با موفقیت حذف شد', 'success');
                }
            }
            if (action === 'edit-coach') {
                const id = parseInt(target.dataset.id);
                const coach = state.users.find(u => u.id === id);
                if (!coach) return;
                window.openModal('ویرایش مربی', `
                    <form id="edit-coach-form" class="space-y-4">
                        <input type="hidden" name="id" value="${coach.id}">
                        <div><label class="block text-sm text-gray-400 mb-2">نام و نام خانوادگی</label><input type="text" name="name" value="${coach.name}" required class="w-full bg-darker border border-border rounded-lg px-4 py-3 text-sm text-white outline-none focus:border-primary"></div>
                        <div><label class="block text-sm text-gray-400 mb-2">تخصص</label><input type="text" name="specialty" value="${coach.specialty || ''}" class="w-full bg-darker border border-border rounded-lg px-4 py-3 text-sm text-white outline-none focus:border-primary"></div>
                        <div><label class="block text-sm text-gray-400 mb-2">شماره تماس</label><input type="text" name="phone" value="${coach.phone || ''}" class="w-full bg-darker border border-border rounded-lg px-4 py-3 text-sm text-white outline-none focus:border-primary"></div>
                        <div class="flex justify-end gap-3 pt-4">
                            <button type="button" onclick="window.closeModal()" class="px-4 py-2 text-gray-300 hover:text-white text-sm bg-card-hover rounded-lg">انصراف</button>
                            <button type="submit" class="btn-primary px-6 py-2 rounded-lg text-sm font-medium">ذخیره</button>
                        </div>
                    </form>
                `);
            }
            if (action === 'edit-exercise') {
                const id = parseInt(target.dataset.id);
                const exercise = state.exercises.find(e => e.id === id);
                if (!exercise) return;
                window.openModal('ویرایش حرکت', `
                    <form id="edit-exercise-form" class="space-y-4">
                        <input type="hidden" name="id" value="${exercise.id}">
                        <div><label class="block text-sm text-gray-400 mb-2">نام حرکت</label><input type="text" name="name" value="${exercise.name}" required class="w-full bg-darker border border-border rounded-lg px-4 py-3 text-sm text-white outline-none focus:border-primary"></div>
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="block text-sm text-gray-400 mb-2">عضله هدف</label><select name="muscle" required class="w-full bg-darker border border-border rounded-lg px-4 py-3 text-sm text-white outline-none focus:border-primary">${state.exerciseCategories.map(c => `<option value="${c}" ${exercise.muscle === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
                            <div><label class="block text-sm text-gray-400 mb-2">تجهیزات</label><input type="text" name="equipment" value="${exercise.equipment}" required class="w-full bg-darker border border-border rounded-lg px-4 py-3 text-sm text-white outline-none focus:border-primary"></div>
                        </div>
                        <div><label class="block text-sm text-gray-400 mb-2">سطح دشواری</label><select name="difficulty" class="w-full bg-darker border border-border rounded-lg px-4 py-3 text-sm text-white outline-none focus:border-primary"><option ${exercise.difficulty === 'مبتدی' ? 'selected' : ''}>مبتدی</option><option ${exercise.difficulty === 'متوسط' ? 'selected' : ''}>متوسط</option><option ${exercise.difficulty === 'پیشرفته' ? 'selected' : ''}>پیشرفته</option></select></div>
                        <div><label class="block text-sm text-gray-400 mb-2">توضیحات</label><textarea name="description" rows="3" class="w-full bg-darker border border-border rounded-lg px-4 py-3 text-sm text-white outline-none focus:border-primary">${exercise.description}</textarea></div>
                        <div><label class="block text-sm text-gray-400 mb-2">تصویر حرکت</label><input type="file" name="imageFile" accept="image/*" class="w-full bg-darker border border-border rounded-lg px-4 py-3 text-sm text-white outline-none focus:border-primary file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-primary file:text-white hover:file:bg-primary-hover"></div>
                        <div><label class="block text-sm text-gray-400 mb-2">ویدیوی حرکت</label><input type="file" name="videoFile" accept="video/*" class="w-full bg-darker border border-border rounded-lg px-4 py-3 text-sm text-white outline-none focus:border-primary file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-primary file:text-white hover:file:bg-primary-hover"></div>
                        ${exercise.image ? `<div class="bg-darker rounded-lg p-2"><img src="${exercise.image}" class="w-full h-32 object-cover rounded" alt="preview"></div>` : ''}

                    id: Math.max(...state.users.map(u => u.id)) + 1, username, password: formData.get('password'),
                    name: formData.get('name'), specialty: formData.get('specialty'), phone: formData.get('phone'), role: 'coach', experience: 0, certification: '', avatar: null
                });
                window.closeModal();
                render();
                window.showToast('مربی جدید با موفقیت اضافه شد', 'success');
            }
            if (e.target.id === 'add-exercise-form') {
                e.preventDefault();
                const formData = new FormData(e.target);
                const imgFile = formData.get('imageFile');
                const vidFile = formData.get('videoFile');
                state.exercises.push({
                    id: Math.max(...state.exercises.map(ex => ex.id)) + 1, name: formData.get('name'), muscle: formData.get('muscle'),
                    equipment: formData.get('equipment'), difficulty: formData.get('difficulty'), description: formData.get('description'),
                    image: (imgFile && imgFile.size > 0) ? URL.createObjectURL(imgFile) : null,
                    video: (vidFile && vidFile.size > 0) ? URL.createObjectURL(vidFile) : null
                });
                window.closeModal();
                render();
                window.showToast('حرکت جدید با موفقیت اضافه شد', 'success');
            }
            if (e.target.id === 'add-category-form') {
                e.preventDefault();
                const formData = new FormData(e.target);
                const categoryName = formData.get('categoryName').trim();
                if (categoryName && !state.exerciseCategories.includes(categoryName)) {
                    state.exerciseCategories.push(categoryName);
                    window.closeModal();
                    render();
                    window.showToast('دسته‌بندی جدید با موفقیت اضافه شد', 'success');
                } else {
                    window.showToast('این دسته‌بندی قبلاً وجود دارد یا نامعتبر است', 'error');
                }
            }
            if (e.target.id === 'add-to-plan-form') {
                e.preventDefault();
                const formData = new FormData(e.target);
                const studentId = parseInt(formData.get('studentId'));
                const dayIndex = parseInt(formData.get('dayIndex'));
                state.workoutPlans[studentId].days[dayIndex].exercises.push({
                    exerciseId: parseInt(formData.get('exerciseId')), sets: parseInt(formData.get('sets')),
                    reps: parseInt(formData.get('reps')), rest: parseInt(formData.get('rest'))
                });
                window.closeModal();
                render();
                window.showToast('حرکت به برنامه اضافه شد', 'success');
            }
            if (e.target.id === 'chat-form') {
                e.preventDefault();
                const input = document.getElementById('chat-input');
                const text = input.value.trim();
                if (text && state.activeChat) {
                    const now = new Date();
                    const time = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
                    const chat = state.chats.find(c => c.id === state.activeChat);
                    if (chat) {
                        chat.messages.push({
                            id: Date.now(), senderId: state.currentUser.id, senderRole: state.currentUser.role,
                            type: 'text', content: text, time: time
                        });
                        input.value = '';
                        render();
                        setTimeout(() => {
                            const chatBox = document.getElementById('chat-messages');
                            if(chatBox) chatBox.scrollTop = chatBox.scrollHeight;
                        }, 100);
                    }
                }
            }
            if (e.target.id === 'profile-form') {
                e.preventDefault();
                const formData = new FormData(e.target);
                state.currentUser.name = formData.get('name');
                state.currentUser.phone = formData.get('phone');
                if (formData.get('weight')) state.currentUser.weight = parseInt(formData.get('weight'));
                if (formData.get('goal')) state.currentUser.goal = formData.get('goal');
                const user = state.users.find(u => u.id === state.currentUser.id);
                if (user) Object.assign(user, state.currentUser);
                render();
                window.showToast('پروفایل با موفقیت بروزرسانی شد', 'success');
            }
            if (e.target.id === 'gym-settings-form') {
                e.preventDefault();
                window.showToast('تنظیمات با موفقیت ذخیره شد', 'success');
            }
        });

        window.handleChatFile = function(input) {
            if (!input.files || !input.files[0] || !state.activeChat) return;
            const file = input.files[0];
            const url = URL.createObjectURL(file);
            const type = file.type.startsWith('image/') ? 'image' : 'video';
            const now = new Date();
            const time = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
            
            const chat = state.chats.find(c => c.id === state.activeChat);
            if (chat) {
                chat.messages.push({
                    id: Date.now(), senderId: state.currentUser.id, senderRole: state.currentUser.role,
                    type: type, content: url, fileName: file.name, time: time
                });
                render();
                setTimeout(() => {
                    const chatBox = document.getElementById('chat-messages');
                    if(chatBox) chatBox.scrollTop = chatBox.scrollHeight;
                }, 100);
            }
            input.value = '';
        };

        render();
    </script>
</body>
</html>
